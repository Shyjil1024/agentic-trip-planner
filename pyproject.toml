[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-trip-planner"
version = "0.1.0"
description = "A stateful, constraint-aware travel planning platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx2>=0.1.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["trip_planner*"]
